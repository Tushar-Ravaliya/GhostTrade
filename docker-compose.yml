services:
  server:
    build: ./server
    container_name: ghosttrade_backend
    ports:
      - "5000:5000"
    env_file:
      - .env

    environment:
      - PORT=5000
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    container_name: ghosttrade_frontend
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true

    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
